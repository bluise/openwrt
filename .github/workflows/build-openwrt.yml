name: Build OpenWrt 25.12 (ImageBuilder)

# ============================================================================
# 为什么用 ImageBuilder 而不是 `make world`:
#
# 原来的 `make world` 流程每次都要从源码编译整个工具链, 其中 tools/llvm-bpf
# 会从源码编译 LLVM 21.1.6 (3898 个 C++ 目标单元)。实测在 4 核 runner 上
# 光 LLVM 就需约 4.5 小时, 而 workflow 给该步的 timeout 只有 280 分钟 ——
# 必然超时, 表现为"日志静止、看起来卡死"(LLVM 编译是长时间无输出的单次编译)。
#
# ImageBuilder 使用官方预编译的 kernel + packages 组装固件, 实测几分钟完成,
# 且功能完全等价(可自由选包 + 加第三方插件 + 注入自定义文件)。
#
# 版本必须用 v25.12.5 而不是 v25.12.0:
#   v25.12.0 内核 6.12.71 / v25.12.5 内核 6.12.94
#   而 OpenAppFilter(OAF) 的预编译内核模块是按 6.12.94 编的,
#   内核版本必须完全一致, 否则 kmod-oaf 无法安装(ABI 不匹配)。
# ============================================================================

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'files/**'
      - 'scripts/**'
      - '.config'
      - 'README.md'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release (e.g. 25.12.5)'
        required: false
        default: '25.12.5'
        type: string
  schedule:
    # 每周日 03:00 UTC = 北京时间周日 11:00, 用于跟踪上游新版本
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      # 单一版本来源: 手动触发可覆盖, 定时/推送用默认值
      TARGET: x86/64
      PROFILE: generic
      # 第三方插件版本(预编译包, 避免从源码编译)
      OPENCLASH_VER: '0.47.156'
      OAF_VER: '7.0.1'
      OAF_LUCI_VER: '7.0-r1'
      # OAF v7.0.1 的预编译内核模块对应的内核版本, 必须与 release 的内核一致
      OAF_KERNEL: '6.12.94'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve latest OpenWrt release
        id: release
        run: |
          set -euo pipefail
          # 手动触发: 用输入值并强制构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.openwrt_version }}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST=$(curl -fsSL https://downloads.openwrt.org/releases/ \
                   | grep -oE '25\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "==> 上游最新 release: $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

          # 定时触发: 只有新版本才构建(避免每周盲目重编); 代码推送: 总是构建
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if git show-ref --verify --quiet refs/tags/firmware-built-"$LATEST"; then
              echo "==> 该版本已构建过, 跳过"
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "==> 检测到新版本, 开始构建"
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.release.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk gettext libncurses-dev unzip file wget rsync \
            python3 zstd cpio

      - name: Verify OAF kernel matches release kernel
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # 从官方 manifest 读取该 release 的内核版本
          MF="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${TARGET}/openwrt-${OPENWRT_RELEASE}-x86-64.manifest"
          KERNEL=$(curl -fsSL "$MF" | awk '$1=="kernel" {print $3}' | cut -d'~' -f1)
          echo "==> release ${OPENWRT_RELEASE} 内核: ${KERNEL}"
          echo "==> OAF 模块要求内核        : ${OAF_KERNEL}"
          if [ "$KERNEL" != "$OAF_KERNEL" ]; then
            echo "::error::内核不匹配: release 为 ${KERNEL}, 而 OAF v${OAF_VER} 的预编译模块需要 ${OAF_KERNEL}。"
            echo "请改用与模块匹配的 release, 或把 OAF_VER/OAF_KERNEL 换成对应的版本组合。"
            echo "已知组合: v7.0.1->25.12.5(6.12.94), v6.1.7->25.12.0(6.12.71), v6.1.8->25.12.2/25.12.4"
            exit 1
          fi
          echo "==> 内核一致, 继续"

      - name: Download official ImageBuilder
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          IB_NAME="openwrt-imagebuilder-${OPENWRT_RELEASE}-x86-64.Linux-x86_64"
          URL="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${TARGET}/${IB_NAME}.tar.zst"
          echo "==> $URL"
          curl -fSL -o imagebuilder.tar.zst "$URL"
          tar --zstd -xf imagebuilder.tar.zst
          echo "IB_DIR=${IB_NAME}" >> "$GITHUB_ENV"
          echo "==> ImageBuilder 就绪: $(ls -d ${IB_NAME})"

      - name: Stage third-party plugins (prebuilt packages)
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          PKGDIR="${IB_DIR}/packages"
          OPENCLASH_TAG="v${OPENCLASH_VER}"
          OAF_TAG="v${OAF_VER}"

          # OpenClash: 官方 release 直接提供 .apk, 文件名即 name-version.apk
          curl -fSL -o "${PKGDIR}/luci-app-openclash-${OPENCLASH_VER}.apk" \
            "https://github.com/vernesong/OpenClash/releases/download/${OPENCLASH_TAG}/luci-app-openclash-${OPENCLASH_VER}.apk"

          # OpenAppFilter: 内核模块在 per-target tar.gz 里(必须匹配内核 6.12.94)
          # OAF 的 tar 包名带 OpenWrt 版本(25.12.5)与内核版本(6.12.94),
          # 两者都必须与所选 release 完全一致, 否则 kmod-oaf 装不上(ABI 不匹配)。
          OAF_OWRT="${OPENWRT_RELEASE%.*}"          # 25.12.5 -> 25.12
          OAF_TARBALL="openwrt${OPENWRT_RELEASE}-oaf_v${OAF_VER}-x86_64-kernel_${OAF_KERNEL}.tar.gz"
          echo "==> OAF 模块: ${OAF_TARBALL}"
          curl -fSL -o oaf-kmod.tar.gz \
            "https://github.com/destan19/OpenAppFilter/releases/download/${OAF_TAG}/${OAF_TARBALL}"
          tar xzf oaf-kmod.tar.gz
          # 解出的 kmod-oaf-<kver>-r1.apk / appfilter-<ver>.apk 自带正确文件名
          find . -maxdepth 2 -name 'kmod-oaf-*.apk' -exec cp -v {} "${PKGDIR}/" \;
          find . -maxdepth 2 -name 'appfilter-*.apk'  -exec cp -v {} "${PKGDIR}/" \;

          # LuCI 界面包
          curl -fSL -o "${PKGDIR}/luci-app-oaf-${OAF_LUCI_VER}.apk" \
            "https://github.com/destan19/OpenAppFilter/releases/download/${OAF_TAG}/luci-app-oaf-${OAF_LUCI_VER}.apk"

          # 重要: 本地 apk 文件名必须是 <name>-<version>.apk, 且 version 要与包内元数据
          # 一致。若文件名缺少版本(例如 luci-app-oaf.apk), ImageBuilder 建索引时会注册
          # "luci-app-oaf-7.0-r1" 却找不到对应文件, 安装时报:
          #   ERROR: luci-app-oaf-7.0-r1: package mentioned in index not found
          echo "==> 本地包:"
          ls -l "${PKGDIR}"/*.apk

      - name: Resolve package list
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 来源1: scripts/packages.list (官方源里的包)
          mapfile -t PKGS < <(grep -vE '^[[:space:]]*(#|$)' scripts/packages.list)
          # 来源2: 从第三方 release 拉取的预编译包(它们不在 packages.list 里!)
          #   kmod-oaf / appfilter 来自 OAF 的 per-target tar.gz
          #   luci-app-oaf / luci-app-openclash 来自各自 release 的 .apk
          # 注意: 这几行曾遗漏, 导致插件被静默丢弃(固件 255 个包而非 285 个),
          # 下面的自检就是为了防止再次遗漏。
          PKGS+=(kmod-oaf appfilter luci-app-oaf luci-app-openclash)
          printf '%s\n' "${PKGS[@]}" > /tmp/pkgs.txt
          echo "==> 共 ${#PKGS[@]} 个包:"
          printf '  %s\n' "${PKGS[@]}"

      - name: Self-check package list covers staged local packages
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 自检: packages/ 目录里每个本地 apk 的包名都必须出现在待装清单中,
          # 否则说明上面 PKGS+= 漏了东西 —— 直接失败, 不产出缺插件的固件。
          IB_DIR_PKGS="${IB_DIR}/packages"
          fail=0
          for f in "${IB_DIR_PKGS}"/*.apk; do
            base=$(basename "$f" .apk)
            # 文件名形如 <name>-<version>, 去掉版本号得到包名
            name=$(echo "$base" | sed -E 's/-[0-9][^-]*(~[^-]*)?(-r[0-9]+)?$//; s/-[0-9][^-]*-r[0-9]+$//')
            # base-files/libc/kernel 由 ImageBuilder 自行处理, 无需显式列出
            case "$name" in base-files|libc|kernel) continue ;; esac
            if grep -qx -- "$name" /tmp/pkgs.txt; then
              echo "  [自检 OK] $name"
            else
              echo "::error::本地包 '$name'($(basename "$f"))不在待安装清单中, 会被丢弃!"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "==> 自检通过: 所有本地包都在清单中"

      - name: Rebuild local package index
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          cd "${IB_DIR}"
          # 必须显式重建本地包索引!
          # 若省略此步, make image 内部自己触发的那次索引生成会漏掉刚放入
          # packages/ 的第三方包, 且失败信息被 Makefile 的
          #   `... >/dev/null 2>/dev/null || true`
          # 完全吞掉, 表现为"构建成功但插件没装进去"(实测丢失
          # luci-app-openclash 与 luci-app-oaf, 255 个包 vs 正确 285 个)。
          make package_index
          echo "==> 本地索引包含的包:"
          ls packages/*.apk

      - name: Build firmware
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd "${IB_DIR}"
          PKG_LIST="$(tr '\n' ' ' < /tmp/pkgs.txt)"
          CUSTOM_FILES="${GITHUB_WORKSPACE}/files"
          # 变量名务必避开 OpenWrt 自身使用的 PKGS / FILES:
          # 用 FILES=... 调 make 后, OpenWrt 的 rules.mk 会把 shell 变量
          # FILES 覆盖为空, 导致后续 make 语义错乱 —— 实测表现为
          # PACKAGES 列表末尾的包被静默丢弃、packages.adb 又变成不存在,
          # 最终 luci-app-openclash 与 luci-app-oaf 装不进去。
          # 自定义文件通过 CUSTOM_FILES 传入, 原样覆盖进固件
          # (含 /etc/config/network 与 /usr/bin/openwrt-install)
          #
          # ROOTFS_PARTSIZE 单位为 MiB。设为 2048 => rootfs 分区 2 GiB。
          # 目的: rootfs 上有较多可用空间(否则官方默认仅约 104 MiB)。
          # 代价: 分区内多为零填充, 压缩后镜像约多 15 MiB 左右 —— 实测镜像
          # 体积主要取决于内容(OpenClash 的 GeoSite.dat 就有 11M), 分区大小
          # 影响相对有限。
          # 装到内置盘后仍由 openwrt-install 把分区扩到整盘。
          make image \
            PROFILE="${PROFILE}" \
            PACKAGES="${PKG_LIST}" \
            FILES="${CUSTOM_FILES}" \
            ROOTFS_PARTSIZE=2048 \
            -j"$(nproc)"
          echo "==> 产物:"
          ls -lh bin/targets/x86/64/*.img.gz

      - name: Tag built release
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="firmware-built-${OPENWRT_RELEASE}"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Verify image contents
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd "${IB_DIR}/bin/targets/x86/64"
          test -f "openwrt-${OPENWRT_RELEASE}-x86-64-generic-squashfs-combined-efi.img.gz" \
            || { echo "FATAL: squashfs combined-efi 未生成"; exit 1; }
          test -f "openwrt-${OPENWRT_RELEASE}-x86-64-generic-ext4-combined-efi.img.gz" \
            || { echo "FATAL: ext4 combined-efi 未生成"; exit 1; }
          sha256sum -c sha256sums 2>/dev/null | grep -E 'combined-efi.*OK$' || true
          echo "==> 两个变体与校验和均正常"

      - name: Upload firmware
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-x86_64-${{ env.OPENWRT_RELEASE }}
          path: |
            ${{ github.workspace }}/${{ env.IB_DIR }}/bin/targets/x86/64/*combined-efi*
            ${{ github.workspace }}/${{ env.IB_DIR }}/bin/targets/x86/64/*sha256sums*
          if-no-files-found: error

      - name: Publish Release
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: firmware
          name: OpenWrt ${{ env.OPENWRT_RELEASE }} 固件 (最新构建)
          body: |
            由 ImageBuilder 自动构建于 run #${{ github.run_number }}

            OpenWrt ${{ env.OPENWRT_RELEASE }} (内核与 OAF 预编译模块匹配)

            产物:
            - `*squashfs-combined-efi.img.gz` 只读根文件系统(抗写坏, 可恢复出厂)
            - `*ext4-combined-efi.img.gz` 可写根文件系统(可直接扩容)
            - `sha256sums` 校验和文件(注意: 实际文件名是 `sha256sums`, 不带点)

            已内置: OpenClash ${{ env.OPENCLASH_VER }}、OpenAppFilter ${{ env.OAF_VER }}、
            网卡驱动(r8169 / RTL8153 / MT7922)、LuCI 中文、`openwrt-install`、
            `resize2fs` + `sfdisk`(装到内置盘后扩容用)。
          files: |
            ${{ github.workspace }}/${{ env.IB_DIR }}/bin/targets/x86/64/*combined-efi*
            ${{ github.workspace }}/${{ env.IB_DIR }}/bin/targets/x86/64/*sha256sums*
          overwrite_files: true
          fail_on_unmatched_files: true

name: Build OpenWrt 25.12 (ImageBuilder)

# ============================================================================
# 为什么用 ImageBuilder 而不是 `make world`:
#
# 原来的 `make world` 流程每次都要从源码编译整个工具链, 其中 tools/llvm-bpf
# 会从源码编译 LLVM 21.1.6 (3898 个 C++ 目标单元)。实测在 4 核 runner 上
# 光 LLVM 就需约 4.5 小时, 而 workflow 给该步的 timeout 只有 280 分钟 ——
# 必然超时, 表现为"日志静止、看起来卡死"(LLVM 编译是长时间无输出的单次编译)。
#
# ImageBuilder 使用官方预编译的 kernel + packages 组装固件, 实测几分钟完成,
# 且功能完全等价(可自由选包 + 加第三方插件 + 注入自定义文件)。
#
# 版本必须用 v25.12.5 而不是 v25.12.0:
#   v25.12.0 内核 6.12.71 / v25.12.5 内核 6.12.94
#   而 OpenAppFilter(OAF) 的预编译内核模块是按 6.12.94 编的,
#   内核版本必须完全一致, 否则 kmod-oaf 无法安装(ABI 不匹配)。
# ============================================================================

on:
  push:
    branches: [ main, master ]
    paths:
      - '.github/workflows/**'
      - 'files/**'
      - 'scripts/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release (e.g. 25.12.5)'
        required: false
        default: '25.12.5'
        type: string
  schedule:
    # 每周日 03:00 UTC = 北京时间周日 11:00, 用于跟踪上游新版本
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      # 单一版本来源: 手动触发可覆盖, 定时/推送用默认值
      TARGET: x86/64
      PROFILE: generic
      # 第三方插件版本(预编译包, 避免从源码编译)
      OPENCLASH_VER: '0.47.156'
      OAF_VER: '7.0.1'
      OAF_LUCI_VER: '7.0-r1'
      # OAF v7.0.1 的预编译内核模块对应的内核版本, 必须与 release 的内核一致
      OAF_KERNEL: '6.12.94'
      # Argon 主题(iStoreOS 就是基于它): 官方源里没有这个包, 直接把源码里的
      # 静态文件打进固件。钉住 commit, 保证构建可重复。
      ARGON_SHA: '182294b07f985088b40610f80ec867fe167e41db'   # luci-theme-argon 2.4.7 (20260824)
      # DDNS-GO: 官方源里也没有, 直接用上游发布的 linux_x86_64 静态二进制
      DDNSGO_VER: '6.17.7'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve latest OpenWrt release
        id: release
        run: |
          set -euo pipefail
          # 手动触发: 用输入值并强制构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.openwrt_version }}" >> "$GITHUB_OUTPUT"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LATEST=$(curl -fsSL https://downloads.openwrt.org/releases/ \
                   | grep -oE '25\.[0-9]+\.[0-9]+' | sort -V | tail -1)
          echo "==> 上游最新 release: $LATEST"
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"

          # 定时触发: 只有新版本才构建(避免每周盲目重编); 代码推送: 总是构建
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 必须显式拉取 tags: actions/checkout 默认浅克隆且不带 tags,
            # 否则下面的 show-ref 永远失败, 会导致每周都盲目重编(机制失效)。
            git fetch --tags --force --quiet origin || true
            # 精确匹配. 不能用 firmware-built-${LATEST}(\.[0-9]+)? 这类模糊正则:
            # 实测它会让 25.12.5 误匹配到 firmware-built-25.12.50 的 tag。
            if git show-ref --verify --quiet "refs/tags/firmware-built-${LATEST}"; then
              echo "==> 该版本已构建过, 跳过"
              echo "build=false" >> "$GITHUB_OUTPUT"
            else
              echo "==> 检测到新版本, 开始构建"
              echo "build=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build dependencies
        if: steps.release.outputs.build == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gawk gettext libncurses-dev unzip file wget rsync \
            python3 zstd cpio mtools

      - name: Verify OAF kernel matches release kernel
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          # 从官方 manifest 读取该 release 的内核版本
          MF="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${TARGET}/openwrt-${OPENWRT_RELEASE}-x86-64.manifest"
          KERNEL=$(curl -fsSL "$MF" | awk '$1=="kernel" {print $3}' | cut -d'~' -f1)
          echo "==> release ${OPENWRT_RELEASE} 内核: ${KERNEL}"
          echo "==> OAF 模块要求内核        : ${OAF_KERNEL}"
          if [ "$KERNEL" != "$OAF_KERNEL" ]; then
            echo "::error::内核不匹配: release 为 ${KERNEL}, 而 OAF v${OAF_VER} 的预编译模块需要 ${OAF_KERNEL}。"
            echo "请改用与模块匹配的 release, 或把 OAF_VER/OAF_KERNEL 换成对应的版本组合。"
            echo "已知组合: v7.0.1->25.12.5(6.12.94), v6.1.7->25.12.0(6.12.71), v6.1.8->25.12.2/25.12.4"
            exit 1
          fi
          echo "==> 内核一致, 继续"

      - name: Download official ImageBuilder
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          IB_NAME="openwrt-imagebuilder-${OPENWRT_RELEASE}-x86-64.Linux-x86_64"
          URL="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${TARGET}/${IB_NAME}.tar.zst"
          echo "==> $URL"
          curl -fSL -o imagebuilder.tar.zst "$URL"
          tar --zstd -xf imagebuilder.tar.zst
          echo "IB_DIR=${IB_NAME}" >> "$GITHUB_ENV"
          echo "==> ImageBuilder 就绪: $(ls -d ${IB_NAME})"

      - name: Stage third-party plugins (prebuilt packages)
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          PKGDIR="${IB_DIR}/packages"
          OPENCLASH_TAG="v${OPENCLASH_VER}"
          OAF_TAG="v${OAF_VER}"

          # OpenClash: 官方 release 直接提供 .apk, 文件名即 name-version.apk
          curl -fSL -o "${PKGDIR}/luci-app-openclash-${OPENCLASH_VER}.apk" \
            "https://github.com/vernesong/OpenClash/releases/download/${OPENCLASH_TAG}/luci-app-openclash-${OPENCLASH_VER}.apk"

          # OpenAppFilter: 内核模块在 per-target tar.gz 里(必须匹配内核 6.12.94)
          # OAF 的 tar 包名带 OpenWrt 版本(25.12.5)与内核版本(6.12.94),
          # 两者都必须与所选 release 完全一致, 否则 kmod-oaf 装不上(ABI 不匹配)。
          OAF_OWRT="${OPENWRT_RELEASE%.*}"          # 25.12.5 -> 25.12
          OAF_TARBALL="openwrt${OPENWRT_RELEASE}-oaf_v${OAF_VER}-x86_64-kernel_${OAF_KERNEL}.tar.gz"
          echo "==> OAF 模块: ${OAF_TARBALL}"
          curl -fSL -o oaf-kmod.tar.gz \
            "https://github.com/destan19/OpenAppFilter/releases/download/${OAF_TAG}/${OAF_TARBALL}"
          tar xzf oaf-kmod.tar.gz
          # 解出的 kmod-oaf-<kver>-r1.apk / appfilter-<ver>.apk 自带正确文件名
          find . -maxdepth 2 -name 'kmod-oaf-*.apk' -exec cp -v {} "${PKGDIR}/" \;
          find . -maxdepth 2 -name 'appfilter-*.apk'  -exec cp -v {} "${PKGDIR}/" \;

          # LuCI 界面包
          curl -fSL -o "${PKGDIR}/luci-app-oaf-${OAF_LUCI_VER}.apk" \
            "https://github.com/destan19/OpenAppFilter/releases/download/${OAF_TAG}/luci-app-oaf-${OAF_LUCI_VER}.apk"

          # OAF 中文语言包 —— 缺它 LuCI 里的 OAF 页面就全是英文
          # 坑: 上游把版本号从资产文件名里删掉了(luci-i18n-oaf-zh-cn.apk), 而
          # ImageBuilder 要求本地 apk 文件名必须是 <包名>-<版本>.apk。名字对不上时
          # 建索引会注册 "<包名>-<真实版本>" 却找不到文件, 装的时候才报
          #   ERROR: package mentioned in index not found
          # 它的版本是 LuCI 风格的日期版本(如 26.238.31834~15b2b27), 跟 app 的
          # 7.0-r1 不是一回事, 不能照抄, 所以直接从 apk 容器里读出真实版本再改名。
          # (apk v3 容器: 偏移 4 起是 "ADB.pckg" 段的 raw-deflate 数据, 解出来就是
          #  "包名 版本 @描述" 这样的元数据文本)
          I18N_APK="$(mktemp -d)/luci-i18n-oaf-zh-cn.apk"
          curl -fSL -o "$I18N_APK" \
            "https://github.com/destan19/OpenAppFilter/releases/download/${OAF_TAG}/luci-i18n-oaf-zh-cn.apk"
          I18N_VER=$(python3 -c "import re,sys,zlib;d=open(sys.argv[1],'rb').read();t=zlib.decompressobj(-15).decompress(d[4:]).decode('utf-8','replace');m=re.search(r'luci-i18n-oaf-zh-cn[\x00-\x20]+([0-9][^\s@]*)',t);print(m.group(1) if m else '')" "$I18N_APK" 2>/dev/null || true)
          if [ -z "$I18N_VER" ]; then
            echo "::error::读不出 luci-i18n-oaf-zh-cn 的版本号(上游 apk 容器格式变了?), 不能瞎猜文件名"
            exit 1
          fi
          echo "==> OAF 中文语言包版本: ${I18N_VER}"
          cp "$I18N_APK" "${PKGDIR}/luci-i18n-oaf-zh-cn-${I18N_VER}.apk"

          # 重要: 本地 apk 文件名必须是 <name>-<version>.apk, 且 version 要与包内元数据
          # 一致。若文件名缺少版本(例如 luci-app-oaf.apk), ImageBuilder 建索引时会注册
          # "luci-app-oaf-7.0-r1" 却找不到对应文件, 安装时报:
          #   ERROR: luci-app-oaf-7.0-r1: package mentioned in index not found
          echo "==> 本地包:"
          ls -l "${PKGDIR}"/*.apk

      - name: Resolve package list
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 来源1: scripts/packages.list (官方源里的包)
          mapfile -t PKGS < <(grep -vE '^[[:space:]]*(#|$)' scripts/packages.list)
          # 来源2: 从第三方 release 拉取的预编译包(它们不在 packages.list 里!)
          #   kmod-oaf / appfilter 来自 OAF 的 per-target tar.gz
          #   luci-app-oaf / luci-i18n-oaf-zh-cn / luci-app-openclash 来自各自 release 的 .apk
          # 注意: 这几行曾遗漏, 导致插件被静默丢弃(固件 255 个包而非 285 个),
          # 下面的自检就是为了防止再次遗漏。
          # luci-i18n-oaf-zh-cn 是 OAF 的中文界面翻译包, 漏了它 OAF 页面全英文。
          PKGS+=(kmod-oaf appfilter luci-app-oaf luci-i18n-oaf-zh-cn luci-app-openclash)
          printf '%s\n' "${PKGS[@]}" > /tmp/pkgs.txt
          echo "==> 共 ${#PKGS[@]} 个包:"
          printf '  %s\n' "${PKGS[@]}"

      - name: Self-check package list covers staged local packages
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 自检: packages/ 目录里每个本地 apk 的包名都必须出现在待装清单中,
          # 否则说明上面 PKGS+= 漏了东西 —— 直接失败, 不产出缺插件的固件。
          IB_DIR_PKGS="${IB_DIR}/packages"
          fail=0
          for f in "${IB_DIR_PKGS}"/*.apk; do
            base=$(basename "$f" .apk)
            # 文件名形如 <name>-<version>, 去掉版本号得到包名
            name=$(echo "$base" | sed -E 's/-[0-9][^-]*(~[^-]*)?(-r[0-9]+)?$//; s/-[0-9][^-]*-r[0-9]+$//')
            # base-files/libc/kernel 由 ImageBuilder 自行处理, 无需显式列出
            case "$name" in base-files|libc|kernel) continue ;; esac
            if grep -qx -- "$name" /tmp/pkgs.txt; then
              echo "  [自检 OK] $name"
            else
              echo "::error::本地包 '$name'($(basename "$f"))不在待安装清单中, 会被丢弃!"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "==> 自检通过: 所有本地包都在清单中"

      - name: Rebuild local package index
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          cd "${IB_DIR}"
          # 必须显式重建本地包索引!
          # 若省略此步, make image 内部自己触发的那次索引生成会漏掉刚放入
          # packages/ 的第三方包, 且失败信息被 Makefile 的
          #   `... >/dev/null 2>/dev/null || true`
          # 完全吞掉, 表现为"构建成功但插件没装进去"(实测丢失
          # luci-app-openclash 与 luci-app-oaf, 255 个包 vs 正确 285 个)。
          make package_index
          echo "==> 本地索引包含的包:"
          ls packages/*.apk

      - name: Prepare custom files
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # files/ 会被原样注入固件, 因此脚本必须带执行位, 否则刷完固件后
          # 直接执行会报 "Permission denied"。
          #
          # 必须在这里显式 chmod: 本仓库因克隆环境问题 core.filemode=false,
          # git 不记录权限位, 新增文件会被提交为 100644 —— 实测已发生过一次
          # (files/usr/bin/openwrt 被固化进固件后权限为 644)。
          chmod -R u+rwX,go+rX files || true
          for d in files/usr/bin files/usr/sbin files/etc/init.d files/etc/uci-defaults; do
            [ -d "$d" ] || continue
            find "$d" -type f -exec chmod 755 {} +
            echo "==> $d:"
            ls -l "$d"
          done

      - name: Sanity-check the installer script (syntax + every function defined)
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 存在的意义: 曾经在一次重构里用脚本替换代码块时, 把 clone_src_disk()
          # 整个函数删掉了 —— 脚本语法仍然合法, 直到真机安装时才报
          # "clone_src_disk: not found"。这里在构建阶段就把这类错误挡下来。
          sh -n files/usr/bin/openwrt-install
          missing=0
          for f in \
            clone_src_disk clone_resolve clone_prepare plan_clone clone_plan_report \
            copy_plan copy_range write_target_table grow_target_rootfs target_part_dev \
            check_target_size unmount_target countdown find_target_disk \
            post_install_space_report find_rootfs_partition part_table disk_label_id \
            part_suffix mp_dev_name fs_type_at fs_bytes_at disk_sectors disk_lba_max \
            sectors_to_mib bytes_to_mib image_raw_size disk_of_part disk_desc is_boot_disk \
            disk_mounts list_disks disk_transport first_word zh_en ui_setup ui_note \
            change_lan_ip change_password set_nic_mode show_interfaces show_diag \
            text_menu main_menu do_install valid_ipv4; do
            if ! grep -qE "^[[:space:]]*$f\\(\\)[[:space:]]*\\{" files/usr/bin/openwrt-install; then
              echo "::error::files/usr/bin/openwrt-install 缺少函数: $f"
              missing=1
            fi
          done
          [ "$missing" = "0" ] || exit 1
          # 被删掉的旧函数不该再被调用
          for gone in clone_src_bytes gpt_part_range; do
            if grep -qE "(^|[^a-z_])$gone([^a-z_]|$)" files/usr/bin/openwrt-install; then
              echo "::error::仍在引用已删除的函数: $gone"
              exit 1
            fi
          done
          echo "==> openwrt-install 自检通过: 语法 OK, 关键函数齐备"

          # 磁盘管理: shell 后端 + LuCI 页面(系统 -> 磁盘管理)
          sh -n files/usr/bin/openwrt-storage
          for f in files/usr/bin/openwrt-storage \
                   files/usr/lib/lua/luci/controller/disktool.lua \
                   files/usr/lib/lua/luci/view/disktool.htm \
                   files/usr/share/rpcd/acl.d/luci-app-disktool.json; do
            [ -f "$f" ] || { echo "::error::缺少文件: $f"; exit 1; }
          done
          # 每个子命令都要有对应实现(cmd_list / cmd_grow / ...)
          for c in list grow newpart mount umount; do
            grep -qE "^cmd_$c\\(\\)" files/usr/bin/openwrt-storage || {
              echo "::error::openwrt-storage 缺少子命令实现: cmd_$c"; exit 1; }
          done
          echo "==> 磁盘管理自检通过(shell + LuCI 页面文件齐备)"

      - name: Stage Argon theme (iStoreOS 风格主题)
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 官方源里没有 luci-theme-argon(iStoreOS 用的就是自己 fork 的 Argon),
          # 所以把它当作"自定义文件"直接打进固件。目标路径必须与 LuCI 的
          # luci.mk 一致(否则文件在, LuCI 却找不到, 界面还是默认布局):
          #   htdocs/*  -> /www/                    (luci.mk: HTDOCS=/www)
          #   ucode/*   -> /usr/share/ucode/luci/   (luci.mk: UCODE_LIBRARYDIR)
          #   root/*    -> /                        (含 etc/uci-defaults/30_luci-theme-argon)
          # 踩过的坑: 一开始把 ucode 放成 /usr/share/ucode/ 少了一层 luci/,
          # CSS 加载了但布局仍是默认的(真机反馈"还是老样子")。
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/argon.tar.gz" \
            "https://github.com/jerrykuku/luci-theme-argon/archive/${ARGON_SHA}.tar.gz"
          tar -xzf "$TMP/argon.tar.gz" -C "$TMP"
          SRC=$(dirname "$(find "$TMP" -maxdepth 2 -name Makefile | head -1)")
          for d in htdocs ucode; do
            [ -d "$SRC/$d" ] || { echo "::error::Argon 源码里没有 $d/ (上游结构变了?)"; exit 1; }
          done
          mkdir -p files/www files/usr/share/ucode/luci
          cp -a "$SRC/htdocs/." files/www/
          cp -a "$SRC/ucode/."  files/usr/share/ucode/luci/
          [ -d "$SRC/root" ] && cp -a "$SRC/root/." files/
          # uci-defaults 与 rpcd 脚本必须可执行(本仓库 core.filemode=false, 权限位不跟着 git 走)
          find files/etc/uci-defaults -type f -exec chmod 755 {} + 2>/dev/null || true
          [ -f files/usr/libexec/rpcd/luci.argon_wallpaper ] && \
            chmod 755 files/usr/libexec/rpcd/luci.argon_wallpaper
          echo "==> Argon 静态文件 $(find files/www/luci-static/argon -type f | wc -l) 个"
          echo "==> Argon ucode 模板 $(find files/usr/share/ucode/luci/template/themes/argon -type f | wc -l) 个"
          ls -l files/etc/uci-defaults/30_luci-theme-argon
          # 必须落在 LuCI 真正会去找的目录(luci.mk 的 UCODE_LIBRARYDIR)
          for f in header.ut footer.ut sysauth.ut; do
            [ -f "files/usr/share/ucode/luci/template/themes/argon/$f" ] || {
              echo "::error::Argon 模板 $f 不在 /usr/share/ucode/luci/template/themes/argon/"; exit 1; }
          done
          [ -f files/www/luci-static/argon/css/cascade.css ] || {
            echo "::error::Argon 的 cascade.css 不在 /www/luci-static/argon/css/"; exit 1; }
          grep -q 'luci-static/argon' files/etc/uci-defaults/30_luci-theme-argon || {
            echo "::error::Argon 的 uci-defaults 没有把主题设为默认"; exit 1; }
          rm -rf "$TMP"

      - name: Stage DDNS-GO (x86_64 静态二进制 + LuCI 页面)
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 官方源里没有 ddns-go, 直接用上游 release 的静态二进制(11MB, 无依赖);
          # 它的 LuCI 页面(服务 -> DDNS-GO)在本仓库 files/ 里, 是 Lua 写的。
          TMP=$(mktemp -d)
          curl -fsSL -o "$TMP/ddns-go.tar.gz" \
            "https://github.com/jeessy2/ddns-go/releases/download/v${DDNSGO_VER}/ddns-go_${DDNSGO_VER}_linux_x86_64.tar.gz"
          tar -xzf "$TMP/ddns-go.tar.gz" -C "$TMP"
          [ -f "$TMP/ddns-go" ] || { echo "::error::ddns-go 压缩包里没有 ddns-go"; exit 1; }
          install -m 0755 "$TMP/ddns-go" files/usr/bin/ddns-go
          file files/usr/bin/ddns-go || true
          # 必须是静态链接(固件是 musl, 动态链接的二进制在设备上起不来)且能报版本
          if readelf -d files/usr/bin/ddns-go 2>/dev/null | grep -q NEEDED; then
            echo "::error::ddns-go 不是静态链接, 设备上会起不来"; exit 1
          fi
          files/usr/bin/ddns-go -v
          ls -l files/usr/bin/ddns-go
          rm -rf "$TMP"

      - name: Drop serial console from kernel cmdline (thin clients / Wyse 3040)
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 官方 x86 镜像生成的内核命令行是:
          #   console=tty1 console=ttyS0,115200n8
          # 某些瘦客户机/嵌入式固件会谎报"存在串口", 内核把 ttyS0 注册成 console 后,
          # printk 写这个不工作的 UART 会卡死 —— 现象就是 GRUB 之后停在
          # "Booting OpenWrt" 再也不动(VirtualBox 正常, iStoreOS 的盘正常,
          # 因为它的命令行里没有 ttyS0)。
          # 上游已知问题: https://github.com/openwrt/openwrt/issues/22598
          # (Dell Wyse 3040 / HP t640 / ESXi 均有复现, 目前 upstream 未修)
          #
          # 修法: 在 make image **之前** 把生成这半截命令行的那一行从 ImageBuilder 的
          # 目标 Makefile 里删掉, 于是镜像里直接生成正确的 grub.cfg —— 不需要事后
          # 拆镜像改文件/重压/重算 sha256sums, 风险最小。
          # 只删内核命令行那一行; GRUB 自己的串口终端(serial/terminal_output)保留:
          # 它不会卡, 还能让接了串口线的人在 GRUB 阶段看到菜单。
          MK="${IB_DIR}/target/linux/x86/image/Makefile"
          if [ ! -f "$MK" ]; then
            echo "::error::找不到 $MK —— ImageBuilder 结构与预期不符"
            exit 1
          fi
          # 上游若改了这里, 必须**显式失败**, 绝不能静默发一个带串口控制台的固件
          if ! grep -q '^GRUB_CONSOLE_CMDLINE += console=' "$MK"; then
            echo "::error::上游 Makefile 里没有预期的串口命令行, 补丁需要更新(不要静默放过)"
            exit 1
          fi
          sed -i '/^GRUB_CONSOLE_CMDLINE += console=/d' "$MK"
          if grep -q '^GRUB_CONSOLE_CMDLINE += console=' "$MK"; then
            echo "::error::串口命令行仍在, 补丁没生效"
            exit 1
          fi
          echo "==> 补丁后剩下的相关行(应只剩 console=tty1 与 GRUB 的串口终端):"
          grep -nE 'GRUB_CONSOLE_CMDLINE|GRUB_TERMINALS|GRUB_SERIAL' "$MK"

      - name: Build firmware
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd "${IB_DIR}"
          PKG_LIST="$(tr '\n' ' ' < /tmp/pkgs.txt)"
          CUSTOM_FILES="${GITHUB_WORKSPACE}/files"
          # 变量名注意区分 shell 变量与 make 变量:
          # ImageBuilder 接收自定义文件的 make 变量**只能叫 FILES**, 不可改名;
          # 但不要在 shell 里定义一个名叫 FILES 的变量再 export ——
          # OpenWrt 的 rules.mk 会把它当 make 变量吃掉并覆盖为空, 导致后续
          # make 语义错乱(实测表现: PACKAGES 末尾的包被静默丢弃、
          # packages.adb 又变成不存在, 最终 openclash/oaf 装不进去)。
          # 所以这里先存进 shell 变量 CUSTOM_FILES, 只在 make 命令行上传 FILES=...
          # 自定义文件通过 CUSTOM_FILES 传入, 原样覆盖进固件
          # (含 /etc/config/network 与 /usr/bin/openwrt-install)
          #
          # ROOTFS_PARTSIZE 单位为 MiB。设为 2048 => rootfs 分区 2 GiB。
          # 目的: rootfs 上有较多可用空间(否则官方默认仅约 104 MiB)。
          # 代价: 分区内多为零填充, 压缩后镜像约多 15 MiB 左右 —— 实测镜像
          # 体积主要取决于内容(OpenClash 的 GeoSite.dat 就有 11M), 分区大小
          # 影响相对有限。
          # 装到内置盘后仍由 openwrt-install 把分区扩到整盘。
          make image \
            PROFILE="${PROFILE}" \
            PACKAGES="${PKG_LIST}" \
            FILES="${CUSTOM_FILES}" \
            ROOTFS_PARTSIZE=2048 \
            -j"$(nproc)"
          echo "==> 产物:"
          ls -lh bin/targets/x86/64/*.img.gz

      - name: Verify grub.cfg has no serial console
        if: steps.release.outputs.build == 'true'
        run: |
          set -euo pipefail
          # 检查镜像里的内核命令行是否还带串口控制台(带的话瘦客户机会卡在 Booting)。
          #
          # 注意: 这里必须临时关掉 pipefail —— head/dd 读够就收工会让 gunzip 收到
          # SIGPIPE(141), 开着 pipefail 会把整个管道判为失败, 于是 if 走 else 分支
          # 报 "OK", 把真问题静默放过(本地实测踩到过)。所以改为: 允许管道被截断,
          # 再对落盘的文件做检查, 并核对抠出来的 ESP 大小。
          cd "${IB_DIR}/bin/targets/x86/64"
          fail=0
          for img in openwrt-*-combined-efi.img.gz; do
            echo "-- $img"
            TMPD=$(mktemp -d)
            # ESP(分区1) 的起始扇区与扇区数: 从 GPT 项1 读(偏移 1024, StartingLBA +32,
            # EndingLBA +40)。写成单行, 避免 YAML 块里出现顶格代码把 run: | 截断。
            read -r START COUNT < <(gunzip -c "$img" | head -c 1048576 | python3 -c "import struct,sys; d=sys.stdin.buffer.read(); s,e=struct.unpack('<QQ', d[1056:1072]); print(s, e-s+1)")
            ( set +o pipefail; gunzip -c "$img" | head -c 20971520 > "$TMPD/head.bin" ) || true
            ( set +o pipefail; gunzip -c "$img" | dd of="$TMPD/esp.fat" bs=512 skip="$START" count="$COUNT" status=none ) || true
            if [ ! -s "$TMPD/head.bin" ]; then
              echo "::error::$img 开头读不出来, 无法验证"
              fail=1; rm -rf "$TMPD"; continue
            fi
            EXPECT=$(( COUNT * 512 ))
            GOT=$(wc -c < "$TMPD/esp.fat" 2>/dev/null || echo 0)
            if [ "$GOT" != "$EXPECT" ]; then
              echo "::error::$img 的 ESP 抠取不完整(${GOT}/${EXPECT} 字节), 后面的文件级检查不可信"
              fail=1
            fi
            if grep -q 'console=ttyS0' "$TMPD/head.bin"; then
              echo "::error::$img 里仍存在 console=ttyS0 —— 瘦客户机会卡在 Booting OpenWrt"
              fail=1
            else
              echo "     [自检 OK] 开头 20 MiB 内没有串口控制台参数"
            fi
            if mcopy -i "$TMPD/esp.fat" ::/boot/grub/grub.cfg "$TMPD/grub.cfg" 2>/dev/null; then
              grep -E '^[[:space:]]*linux ' "$TMPD/grub.cfg" | sed 's/^/     /'
              if grep -q 'ttyS0' "$TMPD/grub.cfg"; then
                echo "::error::$img 的 grub.cfg 里仍有 ttyS0"
                fail=1
              fi
              grep -q 'console=tty1' "$TMPD/grub.cfg" \
                || echo "::warning::$img 的 cmdline 里没有 console=tty1, 请确认显示输出正常"
            else
              echo "::warning::读不出 $img 的 ESP(grub.cfg), 只做了字节级检查"
            fi
            rm -rf "$TMPD"
          done
          [ "$fail" -eq 0 ] || exit 1
          echo "==> 两个变体都已确认: 内核命令行不含串口控制台"

      - name: Tag built release
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          TAG="firmware-built-${OPENWRT_RELEASE}"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Verify image contents
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          cd "${IB_DIR}/bin/targets/x86/64"
          test -f "openwrt-${OPENWRT_RELEASE}-x86-64-generic-squashfs-combined-efi.img.gz" \
            || { echo "FATAL: squashfs combined-efi 未生成"; exit 1; }
          test -f "openwrt-${OPENWRT_RELEASE}-x86-64-generic-ext4-combined-efi.img.gz" \
            || { echo "FATAL: ext4 combined-efi 未生成"; exit 1; }
          sha256sum -c sha256sums 2>/dev/null | grep -E 'combined-efi.*OK$' || true
          echo "==> 两个变体与校验和均正常"

      - name: Upload firmware
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        uses: actions/upload-artifact@v7
        with:
          name: OpenWrt-x86_64-${{ env.OPENWRT_RELEASE }}
          path: |
            ${{ github.workspace }}/${{ env.IB_DIR }}/bin/targets/x86/64/*combined-efi*
            ${{ github.workspace }}/${{ env.IB_DIR }}/bin/targets/x86/64/*sha256sums*
          if-no-files-found: error

      - name: Publish Release
        if: steps.release.outputs.build == 'true'
        env:
          OPENWRT_RELEASE: ${{ steps.release.outputs.version }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: firmware
          name: OpenWrt ${{ env.OPENWRT_RELEASE }} 固件 (最新构建)
          body: |
            由 ImageBuilder 自动构建于 run #${{ github.run_number }}

            OpenWrt ${{ env.OPENWRT_RELEASE }} (内核与 OAF 预编译模块匹配)

            产物:
            - `*squashfs-combined-efi.img.gz` 只读根文件系统(抗写坏, 可恢复出厂)
            - `*ext4-combined-efi.img.gz` 可写根文件系统(可直接扩容)
            - `sha256sums` 校验和文件(注意: 实际文件名是 `sha256sums`, 不带点)

            已内置: OpenClash ${{ env.OPENCLASH_VER }}、OpenAppFilter ${{ env.OAF_VER }}、
            网卡驱动(r8169 / RTL8153 / MT7922)、LuCI 中文、`openwrt-install`、
            `resize2fs` + `sfdisk`(装到内置盘后扩容用)。
          files: |
            ${{ github.workspace }}/${{ env.IB_DIR }}/bin/targets/x86/64/*combined-efi*
            ${{ github.workspace }}/${{ env.IB_DIR }}/bin/targets/x86/64/*sha256sums*
          overwrite_files: true
          fail_on_unmatched_files: true

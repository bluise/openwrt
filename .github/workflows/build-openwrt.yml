name: Build OpenWrt 25.12

on:
  push:
    branches: [ main, master ]
    paths:
      - '.config'
      - 'diy-part1.sh'
      - 'diy-part2.sh'
      - 'README.md'
      - 'files/**'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force rebuild even if upstream is unchanged'
        required: false
        default: 'false'
        type: boolean
  schedule:
    # 每周日 03:00 UTC = 北京时间每周日 11:00 自动检查上游
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  # 上游更新检测: 当 OpenWrt 25.12 / OpenClash / OAF 任一仓库有新提交时自动重编译
  check-upstream:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@v5

      - name: Compare upstream state
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          set -e
          OPENWRT_SHA=$(gh api repos/openwrt/openwrt/commits/openwrt-25.12 --jq .sha)
          OPENCLASH_SHA=$(gh api repos/vernesong/OpenClash/commits/master --jq .sha || gh api repos/vernesong/OpenClash/commits/main --jq .sha)
          OAF_SHA=$(gh api repos/destan19/OpenAppFilter/commits/master --jq .sha)
          NEW_STATE="${OPENWRT_SHA} ${OPENCLASH_SHA} ${OAF_SHA}"

          if [ "$FORCE" = "true" ]; then
            echo "==> 手动强制编译"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$NEW_STATE" > last-upstream.sha
            git config user.name "trae-builder"
            git config user.email "actions@github.com"
            git add last-upstream.sha
            git commit -m "Auto: update upstream tracking $(date -u +%F)" || true
            git push || true
          elif [ -f last-upstream.sha ] && [ "$(cat last-upstream.sha)" = "$NEW_STATE" ]; then
            echo "==> 上游无更新, 本次跳过编译"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "==> 检测到上游更新, 开始编译"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "$NEW_STATE" > last-upstream.sha
            git config user.name "trae-builder"
            git config user.email "actions@github.com"
            git add last-upstream.sha
            git commit -m "Auto: update upstream tracking $(date -u +%F)" || true
            git push || true
          fi

  build:
    needs: check-upstream
    if: github.event_name == 'push' || needs.check-upstream.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout
        uses: actions/checkout@v5

      - name: Prepare build env & clean temp files
        run: |
          sudo apt-get clean 2>/dev/null || true
          sudo rm -rf /tmp/* /var/tmp/* /var/cache/apt/archives/* 2>/dev/null || true
          df -h .
          echo "==> Workspace contents:"
          ls -la ${GITHUB_WORKSPACE}/

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-pip python3-ply rsync unzip zlib1g-dev \
            file wget curl jq

      - name: Fetch OpenWrt 25.12 sources
        run: |
          set -e
          SRC=${GITHUB_WORKSPACE}
          DST=${GITHUB_WORKSPACE}/openwrt
          echo "==> Checking source files exist:"
          test -f ${SRC}/.config || { echo "FATAL: .config missing from checkout!"; exit 1; }
          test -f ${SRC}/diy-part1.sh || { echo "FATAL: diy-part1.sh missing!"; exit 1; }
          test -f ${SRC}/diy-part2.sh || { echo "FATAL: diy-part2.sh missing!"; exit 1; }
          echo "==> Cloning OpenWrt 25.12..."
          git clone -b openwrt-25.12 --depth 1 https://github.com/openwrt/openwrt.git ${DST}
          echo "==> Copying config & scripts..."
          cp -f ${SRC}/.config ${DST}/.config
          cp -f ${SRC}/diy-part1.sh ${SRC}/diy-part2.sh ${DST}/
          [ -d ${SRC}/files ] && cp -rf ${SRC}/files ${DST}/
          [ -f ${SRC}/feeds.conf ] && cp -f ${SRC}/feeds.conf ${DST}/feeds.conf || true
          cd ${DST}
          bash diy-part1.sh
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          bash diy-part2.sh

      - name: Make defconfig
        run: |
          cd ${GITHUB_WORKSPACE}/openwrt
          make defconfig

      - name: Download package sources
        run: |
          cd ${GITHUB_WORKSPACE}/openwrt
          make download -j$(nproc)
        timeout-minutes: 90

      - name: Disk space guard
        run: |
          df -h . || true

      - name: Build firmware
        run: |
          cd ${GITHUB_WORKSPACE}/openwrt
          make -j$(nproc) V=s
        timeout-minutes: 240

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt-x86_64-25.12
          path: |
            ${{ github.workspace }}/openwrt/bin/targets/x86/64/*combined-efi*
            ${{ github.workspace }}/openwrt/bin/targets/x86/64/*.sha256sums
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: firmware
          name: OpenWrt 25.12 固件 (最新构建)
          body: |
            自动构建于 run #${{ github.run_number }}
            文件: combined-efi.img.gz (U35 UEFI 启动刷机用) + sha256 校验
          files: |
            ${{ github.workspace }}/openwrt/bin/targets/x86/64/*combined-efi*
            ${{ github.workspace }}/openwrt/bin/targets/x86/64/*.sha256sums
          overwrite: true
          fail_on_unmatched_files: false